# Trigger: publish a GitHub release (tag it e.g. v1.2.3 when creating the release)

name: "Publish Release to PyPI"

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0       # required for hatch-vcs to read git tags

      # A release that ships a stale DEFAULT_NXF_REV silently runs users against
      # the wrong pipeline, so block the publish rather than warn about it.
      # Set repo variable ALLOW_NXF_REV_MISMATCH=true to release against an older revision.
      - name: Check DEFAULT_NXF_REV is the latest Segment-Flow release
        if: vars.ALLOW_NXF_REV_MISMATCH != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEGMENT_FLOW_REPO: FrancisCrickInstitute/Segment-Flow
        run: |
          CURRENT=$(sed -nE 's/^DEFAULT_NXF_REV = "(.*)"$/\1/p' src/aiod_napari/inference/nxf.py)
          LATEST=$(gh release view --repo "$SEGMENT_FLOW_REPO" --json tagName -q .tagName)

          echo "DEFAULT_NXF_REV: ${CURRENT}"
          echo "Latest ${SEGMENT_FLOW_REPO} release: ${LATEST}"

          if [ "$CURRENT" != "${LATEST#v}" ]; then
            echo "::error::DEFAULT_NXF_REV is '${CURRENT}' but the latest Segment-Flow release is '${LATEST}'. Bump it (or set ALLOW_NXF_REV_MISMATCH=true if this is deliberate) before releasing."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Install hatch
        run: uv tool install hatch

      - name: Build wheel and sdist
        run: hatch build

      - name: Smoke test (wheel)
        run: |
          uv run --isolated --no-project \
            --with "$(ls dist/*.whl)" \
            python tests/smoke_test.py

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aiod-napari
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
